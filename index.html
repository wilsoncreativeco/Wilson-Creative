<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What does Wilson Creative actually do?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "We're a full media production house in Brisbane. We shoot brand films, commercials and social content, run professional photography, fly drones for aerial work, and design custom-coded websites - all in-house, under one roof. Most clients come to us for one thing and quickly realise we can handle their entire brand, online and off."
      }
    },
    {
      "@type": "Question",
      "name": "How much does a shoot or project cost?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Most brand projects land between $1,500 and $3,000, with a full brand film - shoot day, colour grade and social cuts - around $2,200. Ongoing content retainers start from $1,100 per month. Smaller one-off sessions such as headshots, aerial stills or a social reel start from $550, and custom websites from $600. Every project is custom-quoted - no padded packages, no surprises."
      }
    },
    {
      "@type": "Question",
      "name": "What kinds of businesses do you work with?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "All sorts - construction and trades, real estate, hospitality, events, gyms, product brands and local businesses. Construction clients love our monthly progress and completion films; real estate and hospitality come to us for photography, aerials and reels; product brands for content that actually sells."
      }
    },
    {
      "@type": "Question",
      "name": "Is your drone work licensed and insured?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. All aerial work is flown by a licensed drone pilot and fully insured, so your shoot is covered and compliant. We capture 4K cinematic aerials, site-progress footage and surveys - whether that's a construction site, acreage, a venue or a property."
      }
    },
    {
      "@type": "Question",
      "name": "Do you only work in Brisbane?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "We're Brisbane-based and travel across South-East Queensland and beyond for shoots. Web projects are handled remotely, so we build sites for clients anywhere in Australia and internationally."
      }
    },
    {
      "@type": "Question",
      "name": "Who owns the final footage and files?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "You do - completely. Once a project's delivered, the final films, photos and website are yours to use however you like, with full rights. Nothing is locked to us, there are no lock-in contracts, and we can hand over raw files on request."
      }
    },
    {
      "@type": "Question",
      "name": "Do you build websites too, or just media?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Both - and together is where the magic happens. We can shoot your content and build the site it lives on, so everything looks and feels like one brand. Sites are custom-coded from scratch - no Wix, no templates - fast, premium and built to convert. Optional managed hosting is $25/month."
      }
    }
  ]
}
</script>
